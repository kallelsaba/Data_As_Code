services:

# ==================================================
# PostgreSQL
# ==================================================

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dataops
      POSTGRES_PASSWORD: dataops

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops"]
      interval: 10s
      timeout: 5s
      retries: 5


# ==================================================
# MySQL (OpenMetadata)
# ==================================================

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openmetadata
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: openmetadata

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]
      interval: 10s
      timeout: 5s
      retries: 5



# ==================================================
# MinIO Data Lake
# ==================================================

  minio:

    image: minio/minio:latest

    container_name: minio

    restart: unless-stopped

    command:
      server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123


    volumes:

      - minio_data:/data


    ports:

      - "9000:9000"
      - "9001:9001"


    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]

      interval: 30s
      timeout: 20s
      retries: 3



# ==================================================
# Airflow Init
# ==================================================

  airflow-init:

    image: apache/airflow:3.0.0

    container_name: airflow-init


    depends_on:

      postgres:
        condition: service_healthy


    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://dataops:dataops@postgres:5432/airflow


      AIRFLOW__CORE__EXECUTOR:
        LocalExecutor


      AIRFLOW__CORE__LOAD_EXAMPLES:
        "false"

    volumes:

      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins


    command:
      bash -c "airflow db migrate"

# ==================================================
# Airflow API Server
# ==================================================

  airflow-api-server:


    image: apache/airflow:3.0.0

    container_name: airflow-api-server


    depends_on:

      airflow-init:
        condition: service_completed_successfully


    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://dataops:dataops@postgres:5432/airflow


      AIRFLOW__CORE__EXECUTOR:
        LocalExecutor


      AIRFLOW__CORE__LOAD_EXAMPLES:
        "false"

      AIRFLOW__API__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"
      AIRFLOW__WEBSERVER__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"


    volumes:

      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins


    ports:

      - "8080:8080"


    command:

      api-server



# ==================================================
# Airflow Scheduler
# ==================================================

  airflow-scheduler:


    image: apache/airflow:3.0.0

    container_name: airflow-scheduler


    depends_on:

      airflow-init:
        condition: service_completed_successfully


    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://dataops:dataops@postgres:5432/airflow


      AIRFLOW__CORE__EXECUTOR:
        LocalExecutor

      AIRFLOW__API__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"
      AIRFLOW__WEBSERVER__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"


    volumes:

      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs


    command:

      scheduler



# ==================================================
# OpenSearch (OpenMetadata)
# ==================================================

  opensearch:

    image: opensearchproject/opensearch:2.11.1

    container_name: opensearch

    restart: unless-stopped


    environment:

      discovery.type: single-node

      OPENSEARCH_JAVA_OPTS:
        "-Xms1G -Xmx1G"

      DISABLE_SECURITY_PLUGIN:
        true


    volumes:

      - opensearch_data:/usr/share/opensearch/data


    ports:

      - "9200:9200"



# ==================================================
# OpenMetadata
# ==================================================

  openmetadata:


    image: openmetadata/server:latest


    container_name: openmetadata


    restart: unless-stopped


    depends_on:

      mysql:
        condition: service_healthy

      opensearch:
        condition: service_started



    environment:

      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver

      DB_SCHEME: mysql
      DB_USE_SSL: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      OM_DATABASE: openmetadata
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata


      SEARCH_TYPE: opensearch

      SEARCH_HOST: opensearch

      SEARCH_PORT: 9200


      SERVER_HOST_API_URL: http://openmetadata:8585


    ports:

      - "8585:8585"


# ==================================================
# Superset Database
# ==================================================

  superset:


    image: apache/superset:latest


    container_name: superset


    restart: unless-stopped


    environment:
      SUPERSET_SECRET_KEY: "8y3LSbqhiMUhOSwOaCmVIOhGJJ/GBJo5/LT/RVFSBdPXMxiEaeXWSGTH"


    depends_on:

      postgres:
        condition: service_healthy


    ports:

      - "8088:8088"


    volumes:

      - superset_home:/app/superset_home




# ==================================================
# FastAPI
# ==================================================

  fastapi:


    build:

      ./fastapi


    container_name: fastapi


    restart: unless-stopped


    ports:

      - "8000:8000"


    depends_on:

      - postgres
      - minio




# ==================================================
# GitLab Runner
# ==================================================

  gitlab-runner:


    image: gitlab/gitlab-runner:latest


    container_name: gitlab-runner


    restart: unless-stopped


    volumes:

      - gitlab_runner:/etc/gitlab-runner

      - /var/run/docker.sock:/var/run/docker.sock



# ==================================================
# dbt
# ==================================================

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.latest
    container_name: dbt
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles:/root/.dbt

    working_dir: /usr/app

    entrypoint: ["tail", "-f", "/dev/null"]


# ==================================================
# Volumes
# ==================================================

volumes:

  postgres_data:

  mysql_data:

  minio_data:

  opensearch_data:

  superset_home:

  gitlab_runner:

