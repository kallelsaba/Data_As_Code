services:

# ==================================================
# PostgreSQL
# ==================================================

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dataops
      POSTGRES_PASSWORD: dataops

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops"]
      interval: 10s
      timeout: 5s
      retries: 5


# ==================================================
# MySQL (OpenMetadata)
# ==================================================

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openmetadata
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: openmetadata

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]
      interval: 10s
      timeout: 5s
      retries: 5



# ==================================================
# MinIO Data Lake
# ==================================================

  minio:

    image: minio/minio:latest

    container_name: minio

    restart: unless-stopped

    command:
      server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123


    volumes:

      - minio_data:/data


    ports:

      - "9000:9000"
      - "9001:9001"


    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]

      interval: 30s
      timeout: 20s
      retries: 3



# ==================================================
# Airflow Init
# ==================================================

  airflow-init:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-init


    depends_on:

      postgres:
        condition: service_healthy


    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://dataops:dataops@postgres:5432/airflow


      AIRFLOW__CORE__EXECUTOR:
        LocalExecutor


      AIRFLOW__CORE__LOAD_EXAMPLES:
        "false"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"

    volumes:

      - /opt/data-platform-prod/airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./sources:/opt/airflow/sources


    command:
      bash -c "airflow db migrate"

# ==================================================
# Airflow API Server
# ==================================================

  airflow-api-server:


    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-api-server


    depends_on:

      airflow-init:
        condition: service_completed_successfully


    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://dataops:dataops@postgres:5432/airflow


      AIRFLOW__CORE__EXECUTOR:
        LocalExecutor


      AIRFLOW__CORE__LOAD_EXAMPLES:
        "false"

      AIRFLOW__API__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"
      AIRFLOW__WEBSERVER__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"


    volumes:

      - /opt/data-platform-prod/airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./sources:/opt/airflow/sources

    ports:

      - "8080:8080"


    command:

      api-server



# ==================================================
# Airflow Scheduler
# ==================================================

  airflow-scheduler:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-scheduler

    user: "50000:999"   # 50000 = uid airflow, 999 = gid docker de l'hôte

    depends_on:

      airflow-init:
        condition: service_completed_successfully


    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://dataops:dataops@postgres:5432/airflow


      AIRFLOW__CORE__EXECUTOR:
        LocalExecutor

      AIRFLOW__API__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"
      AIRFLOW__WEBSERVER__SECRET_KEY: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "9495f3ba95ababb78e58dd3ea2fdb42dc35970902d9b5e6b84f390ef5c4e"

    volumes:

      - /opt/data-platform-prod/airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./sources:/opt/airflow/sources
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      scheduler

# ==================================================
# Pour éliminer le besoin de reserialize à chaque déploiement CI/CD
# ==================================================

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dataops:dataops@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - /opt/data-platform-prod/airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./sources:/opt/airflow/sources
    command: dag-processor


# ==================================================
# OpenSearch (OpenMetadata)
# ==================================================

  opensearch:

    image: opensearchproject/opensearch:2.11.1

    container_name: opensearch

    restart: unless-stopped


    environment:

      discovery.type: single-node

      OPENSEARCH_JAVA_OPTS:
        "-Xms1G -Xmx1G"

      DISABLE_SECURITY_PLUGIN:
        true


    volumes:

      - opensearch_data:/usr/share/opensearch/data


    ports:

      - "9200:9200"



# ==================================================
# OpenMetadata
# ==================================================

  openmetadata:


    image: openmetadata/server:latest


    container_name: openmetadata


    restart: unless-stopped


    depends_on:

      mysql:
        condition: service_healthy

      opensearch:
        condition: service_started



    environment:

      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver

      DB_SCHEME: mysql
      DB_USE_SSL: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      OM_DATABASE: openmetadata
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata


      SEARCH_TYPE: opensearch

      SEARCH_HOST: opensearch

      SEARCH_PORT: 9200

      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: 9200


      SERVER_HOST_API_URL: http://openmetadata:8585


    ports:

      - "8585:8585"

# ==================================================
# OpenMetaData Ingestion
# ==================================================

  om-ingestion:
    build:
      context: ./openmetadata/ingestion
    container_name: om-ingestion
    restart: unless-stopped
    depends_on:
      - trino
      - openmetadata
    volumes:
      - ./openmetadata/ingestion:/ingestion


# ==================================================
# Superset Database
# ==================================================

  superset:

    build:
      context: ./superset

    container_name: superset


    restart: unless-stopped


    environment:
      SUPERSET_SECRET_KEY: "8y3LSbqhiMUhOSwOaCmVIOhGJJ/GBJo5/LT/RVFSBdPXMxiEaeXWSGTH"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py


    depends_on:

      postgres:
        condition: service_healthy


    ports:

      - "8088:8088"


    volumes:

      - superset_home:/app/superset_home




# ==================================================
# FastAPI
# ==================================================

  fastapi:


    build:

      ./fastapi


    container_name: fastapi


    restart: unless-stopped


    ports:

      - "8000:8000"


    depends_on:

      - postgres
      - minio




# ==================================================
# GitLab Runner
# ==================================================

  gitlab-runner:


    image: gitlab/gitlab-runner:latest


    container_name: gitlab-runner


    restart: unless-stopped


    volumes:

      - gitlab_runner:/etc/gitlab-runner

      - /var/run/docker.sock:/var/run/docker.sock



# ==================================================
# dbt
# ==================================================

  dbt:
    build:
      context: ./dbt
    container_name: dbt
    restart: unless-stopped

    depends_on:
      - trino

    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles:/root/.dbt

    working_dir: /usr/app

    entrypoint: ["tail", "-f", "/dev/null"]

# ==================================================
# Mockoon
# ==================================================

  mockoon:
    image: mockoon/cli:latest
    container_name: mockoon
    restart: unless-stopped
    command: ["-d", "/data/mockoon-config.json", "-p", "3000"]
    volumes:
      - ./sources/mockoon:/data
    ports:
      - "3000:3000"


# ==================================================
# SFTP
# ==================================================

  sftp:
    image: atmoz/sftp:latest
    container_name: sftp
    restart: unless-stopped
    volumes:
      - ./sources/sftp:/home/dataops/upload
    ports:
      - "2222:22"
    command: dataops:dataops:1001

# ==================================================
# SMB
# ==================================================

  smb:
    image: dperson/samba:latest
    container_name: smb
    restart: unless-stopped
    command: '-u "dataops;dataops" -s "share;/share;yes;no" -p'
    volumes:
      - ./sources/smb:/share
    ports:
      - "445:445"


# ==================================================
# Hive Metastore
# ==================================================
  hive-metastore:
    image: starburstdata/hive:3.1.3-e.4
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      HIVE_METASTORE_WAREHOUSE_DIR: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_PATH_STYLE_ACCESS: "true"
      REGION: us-east-1
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
      HIVE_HOME: /opt/apache-hive-3.1.3-bin
    ports:
      - "9083:9083"


# ==================================================
# Trino
# ==================================================
  trino:
    image: trinodb/trino:latest
    container_name: trino
    restart: unless-stopped
    depends_on:
      - hive-metastore
    ports:
      - "8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog



# ==================================================
# Dashboard
# ==================================================
  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    depends_on:
      - postgres

# ==================================================
# Volumes
# ==================================================

volumes:

  postgres_data:

  mysql_data:

  minio_data:

  opensearch_data:

  superset_home:

  gitlab_runner:

  hive_metastore_db_data:
