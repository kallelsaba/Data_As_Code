source:
  type: postgres
  serviceName: trino_dataplatform
  sourceConfig:
    config:
      type: TestSuite
      entityFullyQualifiedName: trino_dataplatform.postgres.silver.stg_orders

processor:
  type: orm-test-runner
  config:
    testCases:
      - name: order_id_not_null
        testDefinitionName: columnValuesToBeNotNull
        columnName: order_id

      - name: order_item_id_not_null
        testDefinitionName: columnValuesToBeNotNull
        columnName: order_item_id


      - name: order_status_valid_values
        testDefinitionName: columnValuesToBeInSet
        columnName: order_status
        parameterValues:
          - name: allowedValues
            value: "['delivered','shipped','processing','canceled','invoiced','approved','created','unavailable']"

      - name: price_not_negative
        testDefinitionName: columnValuesToBeBetween
        columnName: price
        parameterValues:
          - name: minValue
            value: "0"
          - name: maxValue
            value: "10000"

      - name: freight_value_not_negative
        testDefinitionName: columnValuesToBeBetween
        columnName: freight_value
        parameterValues:
          - name: minValue
            value: "0"
          - name: maxValue
            value: "1000"

      - name: review_score_range
        testDefinitionName: columnValuesToBeBetween
        columnName: review_score
        parameterValues:
          - name: minValue
            value: "1"
          - name: maxValue
            value: "5"

      - name: customer_id_not_null
        testDefinitionName: columnValuesToBeNotNull
        columnName: customer_id

      - name: product_category_not_null
        testDefinitionName: columnValuesToBeNotNull
        columnName: product_category_name

      - name: delivery_days_positive
        testDefinitionName: columnValuesToBeBetween
        columnName: total_delivery_days
        parameterValues:
          - name: minValue
            value: "0"
          - name: maxValue
            value: "365"

      - name: items_count_positive
        testDefinitionName: columnValuesToBeBetween
        columnName: items_count
        parameterValues:
          - name: minValue
            value: "1"
          - name: maxValue
            value: "50"

      - name: table_row_count_min
        testDefinitionName: tableRowCountToBeBetween
        parameterValues:
          - name: minValue
            value: "1"

sink:
  type: metadata-rest
  config: {}

